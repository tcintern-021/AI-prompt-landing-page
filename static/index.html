<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat API</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <!-- Markdown parser for rendering AI responses nicely -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
  <div class="chat-container">
    <main class="chat-window" id="chatWindow">
      <div class="welcome-screen" id="welcomeScreen">
        <div class="welcome-icon">✨</div>
        <h2>How can I help you today?</h2>
        <p>Ask me anything or click a prompt suggestion below.</p>

        <div class="suggestion-chips">
          <button class="chip" data-prompt="Write a Python script to process CSV data with pandas">💻 Python Pandas
            Script</button>
          <button class="chip" data-prompt="Explain Quantum Computing in simple terms for a beginner">💡 Quantum
            Computing</button>
          <button class="chip" data-prompt="Draft a professional follow-up email after a job interview">✍️ Follow-up
            Email</button>
        </div>
      </div>
      <!-- Messages will appear here -->
    </main>

    <footer class="chat-input-area">
      <form id="chatForm" class="input-form">
        <button type="button" id="clearChatBtn" class="btn-action" title="Clear Chat">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"></path>
            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
          </svg>
        </button>
        <textarea id="chatInput" placeholder="Message AI Chat API..." rows="1" required></textarea>
        <button type="submit" id="sendBtn" class="btn-send" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <div class="footer-text">AI Chat API can make mistakes. Consider verifying important information.</div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>

</html>
